<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="theme-color" content="#030712">
    <title>Space Shooter Multi Bot</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        body {
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            touch-action: none;
            height: 100vh;
            height: 100dvh;
        }

        /* Kontrol sentuh: Tampil di device sentuh (hover:none / coarse) atau saat landscape */
        #touch-controls,
        #rotate-hint {
            display: none;
        }

        @media (pointer: coarse) and (orientation: landscape),
        (hover: none) and (orientation: landscape) {
            #touch-controls {
                display: block;
            }
        }

        @media (pointer: coarse) and (orientation: portrait),
        (hover: none) and (orientation: portrait) {
            #rotate-hint {
                display: flex;
            }
        }
    </style>
</head>

<body class="bg-gray-950 w-screen relative font-mono">

    <!-- HUD PLAYER 1 (POJOK KANAN ATAS) -->
    <div class="fixed top-4 right-4 w-52 sm:w-64 z-20 space-y-2">
        <div id="hud-panel"
            class="bg-gray-900/90 p-3 rounded-lg border border-gray-800 backdrop-blur space-y-2.5 shadow-lg">
            <!-- Header Bar / Mini Bar di Mobile -->
            <div id="hud-toggle" class="flex justify-between items-center cursor-pointer select-none">
                <div>
                    <p class="text-blue-400 font-bold text-xs uppercase">PLAYER 1 (BIRU)</p>
                    <p id="hud-status-mini" class="text-[10px] text-green-400 sm:hidden">100% HP · 20/20</p>
                </div>
                <span id="hud-arrow" class="text-xs text-gray-400 transition-transform duration-200 sm:hidden">▼</span>
            </div>
    
            <!-- Detail HUD (Otomatis tersembunyi di mobile, terbuka di desktop) -->
            <div id="hud-details" class="hidden sm:block space-y-2.5 pt-2 border-t border-gray-800">
                <div>
                    <div class="flex justify-between text-xs font-bold mb-1">
                        <span class="text-green-400">HULL INTEGRITY</span>
                        <span id="hull-text" class="text-green-400">100%</span>
                    </div>
                    <div class="w-full bg-gray-800 h-2.5 rounded-full overflow-hidden border border-green-500/30">
                        <div id="hull-bar" class="bg-green-500 h-full w-full transition-all duration-150"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-xs text-orange-400 font-bold mb-1">
                        <span>MAIN ENGINE</span>
                        <span id="main-fuel-text">100%</span>
                    </div>
                    <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden border border-orange-500/30">
                        <div id="main-fuel-bar" class="bg-orange-500 h-full w-full transition-all duration-75"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-xs text-cyan-400 font-bold mb-1">
                        <span>RCS MANEUVER</span>
                        <span id="rcs-fuel-text">100%</span>
                    </div>
                    <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden border border-cyan-500/30">
                        <div id="rcs-fuel-bar" class="bg-cyan-400 h-full w-full transition-all duration-75"></div>
                    </div>
                </div>
                <div>
                    <div class="flex justify-between text-xs text-yellow-400 font-bold mb-1">
                        <span>AMMO</span>
                        <span id="ammo-text">20/20</span>
                    </div>
                    <div class="w-full bg-gray-800 h-2 rounded-full overflow-hidden border border-yellow-500/30">
                        <div id="ammo-bar" class="bg-yellow-400 h-full w-full transition-all duration-75"></div>
                    </div>
                </div>
            </div>
        </div>
    
        <!-- RESTART WIDGET -->
        <div id="game-over-box"
            class="hidden bg-red-950/90 border border-red-500/60 p-3 rounded-lg backdrop-blur text-center space-y-2 shadow-lg shadow-red-900/40">
            <div id="status-title"
                class="flex items-center justify-center gap-1.5 text-red-400 font-bold text-xs uppercase tracking-wider">
                <span class="inline-block w-2 h-2 rounded-full bg-red-500 animate-ping"></span>
                <span>GAME OVER</span>
            </div>
            <button id="reset-btn"
                class="w-full py-1.5 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded transition-all cursor-pointer">
                RESTART MISSION
            </button>
        </div>
    </div>

    <!-- INDIKATOR JUMLAH MUSUH & KAWAN -->
    <div class="fixed top-4 left-1/2 -translate-x-1/2 z-20 flex gap-3 text-xs font-bold">
        <div class="bg-gray-900/80 px-3 py-1.5 rounded-lg border border-red-500/30 backdrop-blur text-red-400">
            MUSUH <span id="enemy-count">0</span></div>
        <div class="bg-gray-900/80 px-3 py-1.5 rounded-lg border border-blue-500/30 backdrop-blur text-blue-400">
            KAWAN <span id="ally-count">0</span></div>
    </div>

    <!-- TOMBOL TAMBAH BOT -->
    <div class="fixed top-4 left-4 z-20 flex gap-2">
        <button id="add-red"
            class="px-3 py-1.5 bg-red-600 hover:bg-red-500 text-white font-bold text-xs rounded cursor-pointer">+ BOT
            MERAH</button>
        <button id="add-blue"
            class="px-3 py-1.5 bg-blue-600 hover:bg-blue-500 text-white font-bold text-xs rounded cursor-pointer">+ BOT
            BIRU</button>
    </div>

    <!-- KONTROL SENTUH (landscape) -->
    <div id="touch-controls">
        <div id="joy-base"
            class="fixed bottom-6 left-8 z-40 w-36 h-36 rounded-full border-2 border-white/30 bg-white/10 touch-none select-none">
            <div id="joy-knob"
                class="absolute left-1/2 top-1/2 w-14 h-14 rounded-full bg-white/40 border border-white/60 pointer-events-none -translate-x-1/2 -translate-y-1/2">
            </div>
        </div>
        <div class="fixed bottom-6 right-6 z-40 flex items-end gap-3">
            <button data-key="ArrowDown"
                class="touch-none select-none rounded-full border border-white/30 bg-white/10 text-white font-bold flex items-center justify-center w-14 h-14 text-xs">REV</button>
            <button data-key="Space"
                class="touch-none select-none rounded-full border border-white/30 bg-white/10 text-white font-bold flex items-center justify-center w-24 h-24 text-sm bg-red-600/30 border-red-400/50">FIRE</button>
        </div>
        <button id="fs-btn"
            class="fixed bottom-2 left-1/2 -translate-x-1/2 z-40 px-3 py-1 text-[10px] font-bold text-white/70 rounded-full border border-white/20 bg-white/10">⛶
            LAYAR PENUH</button>
    </div>

    <!-- Petunjuk putar layar (portrait) -->
    <div id="rotate-hint"
        class="fixed inset-0 z-50 bg-gray-950/95 items-center justify-center text-center text-gray-200 text-sm p-6">
        <div>Putar perangkat ke mode landscape untuk bermain<br><span class="text-[10px] text-gray-400">iPhone: menu
                Share → Add to Home Screen untuk layar penuh tanpa url bar</span></div>
    </div>

    <script src="play.js"></script>
</body>

</html>
